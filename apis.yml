aid: getground
name: Getground
description: 'GetGround is a London-based property investment platform that lets UK and
  international buy-to-let investors set up and run their rental businesses through a
  limited company. The all-in-one platform handles limited company formation, business
  bank accounts, accounting and tax filing (including Making Tax Digital), bookkeeping,
  buy-to-let mortgages, landlord insurance, tenant finding, and sourcing of investment
  properties. GetGround is backed by QED Investors and offers subscription tiers and
  launch packs for landlords managing single or multiple rental properties.'
